# Compile le tweak ShortLimiter.dylib (arm64) avec clang et le SDK iOS d'un runner macOS, sans signature Apple
# (signature « ad hoc » seulement : LiveContainer le charge dans l'app choisie par l'utilisateur).
# Publie le .dylib dans la version « latest » (lien fixe) et dans une version numérotée 1.0.N.
# Le dépôt et ses versions ne contiennent que ce tweak : aucune app YouTube n'est téléchargée ni publiée.
name: Tweak

on:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tweak-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Compilation
        env:
          RUN: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p out
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -dynamiclib -fobjc-arc -fmodules -O2 -Wall -Wno-deprecated-declarations \
            -DSL_VERSION="\"1.0.$RUN\"" \
            -framework Foundation -framework UIKit \
            -install_name @rpath/ShortLimiter.dylib \
            -o out/ShortLimiter.dylib src/*.m 2>&1 | tee build.log
          codesign -f -s - out/ShortLimiter.dylib
          file out/ShortLimiter.dylib
          ls -l out

      - name: Publication (version « latest » et version numérotée)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          NOTES="Tweak ShortLimiter 1.0.$RUN (${GITHUB_SHA::7}). À ajouter dans l'onglet Tweaks de LiveContainer et à associer à ton app YouTube. Voir le README."
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/ShortLimiter.dylib --target "$GITHUB_SHA" --title "ShortLimiter (dernière version)" --notes "$NOTES"
          gh release create "v1.0.$RUN" out/ShortLimiter.dylib --target "$GITHUB_SHA" \
            --title "ShortLimiter 1.0.$RUN" --notes "$NOTES" --latest=false
