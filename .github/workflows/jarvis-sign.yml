# Signe le raccourci Apple jarvis/Jarvis-v2.shortcut sur un runner macOS (commande `shortcuts sign`, mode « anyone »)
# et remet la version signée dans jarvis/signe/ sur la même branche, pour l'importer directement sur iPhone.
# Le raccourci ne contient aucun secret : la clé du serveur est demandée à l'import.
name: Signature raccourci Jarvis

on:
  push:
    paths: ["jarvis/*.shortcut", ".github/workflows/jarvis-sign.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Signature
        run: |
          sw_vers
          mkdir -p jarvis/signe
          for f in jarvis/*.shortcut; do
            name=$(basename "$f")
            shortcuts sign --mode anyone --input "$f" --output "jarvis/signe/$name"
            head -c 4 "jarvis/signe/$name" | xxd
          done
          ls -la jarvis/signe

      - name: Publication sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jarvis/signe
          git commit -m "Jarvis : raccourci signé [skip ci]" || echo "Rien à publier"
          git push
