# Compile le tweak universel NoteFlowFocus.dylib (arm64) avec clang et le SDK iOS d'un runner macOS : le module commun
# shared/NFFocus.m seul, avec la demande du code de liaison au lancement (NF_PROMPT). Il se met dans n'importe quelle
# app de LiveContainer et la bloque en entier pendant un focus NoteFlow.
# Publie le .dylib dans la version « focus-latest » (lien fixe) et une version numérotée focus-v1.0.N.
name: Tweak NoteFlowFocus

on:
  push:
    branches: [main]
    paths: ["shared/**", "focus/**", ".github/workflows/focus.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focus-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Compilation
        env:
          RUN: ${{ github.run_number }}
        run: |
          set -o pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p out
          # Classes renommées : pas de conflit si ShortLimiter ou StreamBoost (même module) est chargé dans la même app
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
            -dynamiclib -fobjc-arc -fmodules -O2 -Wall -Wno-deprecated-declarations \
            -DNF_PROMPT=1 -DNFFocus=NFUFocus -DNFRoot=NFURoot -DNF_VERSION="\"1.0.$RUN\"" \
            -framework Foundation -framework UIKit -framework AVFoundation -framework Security -Ishared \
            -install_name @rpath/NoteFlowFocus.dylib \
            -o out/NoteFlowFocus.dylib shared/*.m 2>&1 | tee build.log
          codesign -f -s - out/NoteFlowFocus.dylib
          file out/NoteFlowFocus.dylib

      - name: Publication (version « focus-latest » et version numérotée)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          NOTES="Tweak NoteFlowFocus 1.0.$RUN (${GITHUB_SHA::7}) : bloque l'app où il est ajouté pendant un focus NoteFlow. À ajouter par lien dans les Tweaks de l'app (SideStore). Voir focus/README.md."
          gh release delete focus-latest --yes --cleanup-tag || true
          gh release create focus-latest out/NoteFlowFocus.dylib --target "$GITHUB_SHA" --title "NoteFlowFocus (dernière version)" --notes "$NOTES" --latest=false
          gh release create "focus-v1.0.$RUN" out/NoteFlowFocus.dylib --target "$GITHUB_SHA" \
            --title "NoteFlowFocus 1.0.$RUN" --notes "$NOTES" --latest=false
